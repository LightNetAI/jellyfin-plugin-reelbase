name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.Reelbase/Jellyfin.Plugin.Reelbase.csproj -c Release

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.Reelbase.Tests/Jellyfin.Plugin.Reelbase.Tests.csproj -c Release
